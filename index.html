<!doctype html>
<html lang="hu">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Snake | Neon Circuit</title>
	<style>
		:root {
			--ink: #ecf7ff;
			--muted: #88a4b7;
			--panel: rgba(9, 24, 37, 0.88);
			--line: rgba(132, 199, 226, 0.2);
			--cyan: #54e5d1;
			--lime: #b8f35c;
			--coral: #ff7d6e;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--ink);
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
			background:
				radial-gradient(circle at 15% 15%, rgba(84, 229, 209, 0.12), transparent 30%),
				radial-gradient(circle at 85% 85%, rgba(184, 243, 92, 0.1), transparent 28%),
				#07131d;
		}

		main { width: min(100%, 620px); }

		.eyebrow {
			margin: 0 0 8px;
			color: var(--cyan);
			font-size: 0.75rem;
			font-weight: 700;
			letter-spacing: 0.22em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(2.3rem, 8vw, 4.7rem);
			line-height: 0.95;
			letter-spacing: 0.02em;
		}

		.intro {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 20px;
			margin-bottom: 22px;
		}

		.subtitle { margin: 12px 0 0; color: var(--muted); font-size: 0.95rem; }

		.scoreboard {
			display: flex;
			flex-shrink: 0;
			gap: 12px;
		}

		.score {
			min-width: 82px;
			padding: 10px 12px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel);
		}

		.score small { display: block; color: var(--muted); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; }
		.score strong { display: block; margin-top: 3px; color: var(--lime); font-size: 1.45rem; }

		.game-shell {
			position: relative;
			padding: 12px;
			border: 1px solid var(--line);
			border-radius: 12px;
			background: rgba(4, 14, 23, 0.8);
			box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28), 0 0 50px rgba(84, 229, 209, 0.06);
		}

		canvas {
			display: block;
			width: 100%;
			aspect-ratio: 1;
			border-radius: 5px;
			background: #091d2a;
		}

		.overlay {
			position: absolute;
			inset: 12px;
			display: grid;
			place-items: center;
			padding: 24px;
			border-radius: 5px;
			background: rgba(5, 17, 27, 0.86);
			text-align: center;
		}

		.overlay[hidden] { display: none; }
		.overlay h2 { margin: 0 0 8px; font-size: 2rem; }
		.overlay p { margin: 0 0 20px; color: var(--muted); }

		button {
			border: 0;
			border-radius: 6px;
			padding: 12px 20px;
			color: #06161d;
			background: var(--lime);
			font: inherit;
			font-weight: 800;
			cursor: pointer;
			transition: transform 140ms ease, filter 140ms ease;
		}

		button:hover { filter: brightness(1.08); transform: translateY(-2px); }
		button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

		.controls {
			display: flex;
			justify-content: space-between;
			gap: 16px;
			margin-top: 17px;
			color: var(--muted);
			font-size: 0.85rem;
		}

		.controls kbd {
			display: inline-grid;
			min-width: 25px;
			min-height: 25px;
			place-items: center;
			margin: 0 2px;
			border: 1px solid var(--line);
			border-bottom-width: 2px;
			border-radius: 4px;
			color: var(--ink);
			background: rgba(132, 199, 226, 0.08);
			font-size: 0.75rem;
		}

		@media (max-width: 520px) {
			body { padding: 16px; }
			.intro { align-items: start; flex-direction: column; gap: 14px; }
			.scoreboard { width: 100%; }
			.score { flex: 1; }
			.controls { flex-direction: column; gap: 8px; }
		}
	</style>
</head>
<body>
	<main>
		<section class="intro" aria-label="Játék információk">
			<div>
				<p class="eyebrow">Classic arcade / 01</p>
				<h1>Snake</h1>
				<p class="subtitle">Gyűjtsd be a fénygömböket, és ne ütközz!</p>
			</div>
			<div class="scoreboard" aria-label="Eredmények">
				<div class="score"><small>Pontszám</small><strong id="score">0</strong></div>
				<div class="score"><small>Rekord</small><strong id="high-score">0</strong></div>
			</div>
		</section>

		<section class="game-shell" aria-label="Snake játéktér">
			<canvas id="game" width="480" height="480" aria-label="Snake játéktábla"></canvas>
			<div class="overlay" id="game-over" hidden>
				<div>
					<h2>Vége a játéknak</h2>
					<p id="result">Pontszám: 0</p>
					<button id="restart" type="button">Újrakezdés</button>
				</div>
			</div>
		</section>

		<div class="controls">
			<span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> vagy <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> irányítás</span>
			<span>Szóköz: új játék</span>
		</div>
	</main>

	<script>
		const canvas = document.querySelector('#game');
		const context = canvas.getContext('2d');
		const scoreElement = document.querySelector('#score');
		const highScoreElement = document.querySelector('#high-score');
		const overlay = document.querySelector('#game-over');
		const resultElement = document.querySelector('#result');
		const restartButton = document.querySelector('#restart');

		const gridSize = 24;
		const tileSize = canvas.width / gridSize;
		const directions = {
			ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
			ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
			ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
			ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 }
		};

		let snake;
		let food;
		let direction;
		let nextDirection;
		let score;
		let highScore = Number(localStorage.getItem('snake-high-score') || 0);
		let gameOver;
		let gameTimer;

		highScoreElement.textContent = highScore;

		function startGame() {
			snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
			direction = { x: 1, y: 0 };
			nextDirection = direction;
			score = 0;
			gameOver = false;
			scoreElement.textContent = score;
			overlay.hidden = true;
			placeFood();
			clearInterval(gameTimer);
			gameTimer = setInterval(tick, 105);
			draw();
		}

		function placeFood() {
			do {
				food = { x: Math.floor(Math.random() * gridSize), y: Math.floor(Math.random() * gridSize) };
			} while (snake.some(segment => segment.x === food.x && segment.y === food.y));
		}

		function tick() {
			direction = nextDirection;
			const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
			const hitWall = head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize;
			const hitSelf = snake.some(segment => segment.x === head.x && segment.y === head.y);

			if (hitWall || hitSelf) {
				finishGame();
				return;
			}

			snake.unshift(head);
			if (head.x === food.x && head.y === food.y) {
				score += 10;
				scoreElement.textContent = score;
				if (score > highScore) {
					highScore = score;
					highScoreElement.textContent = highScore;
					localStorage.setItem('snake-high-score', highScore);
				}
				placeFood();
			} else {
				snake.pop();
			}
			draw();
		}

		function finishGame() {
			gameOver = true;
			clearInterval(gameTimer);
			resultElement.textContent = `Pontszám: ${score}`;
			overlay.hidden = false;
		}

		function draw() {
			context.fillStyle = '#091d2a';
			context.fillRect(0, 0, canvas.width, canvas.height);
			context.strokeStyle = 'rgba(132, 199, 226, 0.07)';
			context.lineWidth = 1;
			for (let index = 1; index < gridSize; index += 1) {
				const position = index * tileSize;
				context.beginPath();
				context.moveTo(position, 0); context.lineTo(position, canvas.height);
				context.moveTo(0, position); context.lineTo(canvas.width, position);
				context.stroke();
			}

			context.fillStyle = '#ff7d6e';
			context.beginPath();
			context.arc((food.x + 0.5) * tileSize, (food.y + 0.5) * tileSize, tileSize * 0.31, 0, Math.PI * 2);
			context.fill();

			snake.forEach((segment, index) => {
				context.fillStyle = index === 0 ? '#b8f35c' : '#54e5d1';
				const inset = index === 0 ? 2 : 3;
				context.fillRect(segment.x * tileSize + inset, segment.y * tileSize + inset, tileSize - inset * 2, tileSize - inset * 2);
			});
		}

		document.addEventListener('keydown', event => {
			if (event.code === 'Space') {
				event.preventDefault();
				if (gameOver) startGame();
				return;
			}
			const requested = directions[event.key];
			if (!requested) return;
			event.preventDefault();
			if (requested.x + direction.x !== 0 || requested.y + direction.y !== 0) {
				nextDirection = requested;
			}
		});

		restartButton.addEventListener('click', startGame);
		startGame();
	</script>
</body>
</html>
